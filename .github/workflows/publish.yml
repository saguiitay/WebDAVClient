name: Validate and publish

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - 'LICENSE.md'
      - 'ROADMAP.md'
      - '.gitignore'
      - 'plans/**'
      - '.github/**'
      - '!.github/workflows/publish.yml'
  workflow_dispatch:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'publish-nuget' || github.event_name == 'pull_request' && format('validate-pr-{0}', github.event.pull_request.number) || format('validate-push-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-notes.outputs.version }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Require braces in C# control-flow blocks
        run: dotnet format style WebDAVClient.sln --diagnostics IDE0011 --severity error --no-restore --verify-no-changes

      - name: Build
        id: build
        run: dotnet build -c Release --no-restore

      - name: Test .NET 8
        run: dotnet test tests/WebDAVClient.UnitTests/WebDAVClient.UnitTests.csproj -c Release -f net8.0 --no-build --verbosity normal -p:CollectCoverage=true

      - name: Test compatibility harness offline
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test tests/WebDAVClient.InteropTests/WebDAVClient.InteropTests.csproj -c Release --no-build --verbosity normal

      - name: Test .NET 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test tests/WebDAVClient.UnitTests/WebDAVClient.UnitTests.csproj -c Release -f net10.0 --no-build --verbosity normal -p:CollectCoverage=true

      - name: Upload coverage reports
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: tests/WebDAVClient.UnitTests/TestResults/coverage/**/*.cobertura.xml
          if-no-files-found: error

      - name: Pack
        if: ${{ success() && github.event_name == 'workflow_dispatch' }}
        run: dotnet pack src/WebDAVClient/WebDAVClient.csproj -c Release --no-build -o ${{ github.workspace }}/Release/nuget

      - name: Validate release notes
        id: release-notes
        shell: pwsh
        run: |
          & .\scripts\Test-ReleaseNotes.ps1
          [xml]$project = Get-Content src/WebDAVClient/WebDAVClient.csproj
          $version = $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          & .\scripts\Get-ReleaseNotes.ps1 -Version $version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Push to NuGet
        if: ${{ success() && github.event_name == 'workflow_dispatch' }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          for file in Release/nuget/WebDAVClient.*.nupkg; do
            dotnet nuget push -s https://api.nuget.org/v3/index.json -k "$NUGET_API_KEY" "$file"
            echo "Published $(basename "$file")" >> "$GITHUB_STEP_SUMMARY"
          done

  release:
    needs: publish
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag published version and create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          $version = $env:VERSION
          $tag = "v$version"
          $existing = git tag --list $tag
          if ($existing)
          {
              $target = git rev-parse "$tag^{commit}"
              if ($LASTEXITCODE -ne 0 -or $target -ne $env:GITHUB_SHA)
              {
                  throw "Tag $tag does not point to the published commit."
              }
          }
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          & .\scripts\Get-ReleaseNotes.ps1 -Version $version | Set-Content $notes
          $options = @()
          if ($version.Contains('-'))
          {
              $options += '--prerelease'
          }
          gh release create $tag --target $env:GITHUB_SHA --title "WebDAVClient $version" --notes-file $notes @options
          if ($LASTEXITCODE -ne 0)
          {
              throw "GitHub release creation failed. The NuGet package is already published; repair the release without republishing it."
          }
