name: Validate and publish

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - 'LICENSE.md'
      - 'ROADMAP.md'
      - '.gitignore'
      - 'plans/**'
      - '.github/**'
      - '!.github/workflows/publish.yml'
  workflow_dispatch:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('validate-pr-{0}', github.event.pull_request.number) || 'publish-nuget' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Require braces in C# control-flow blocks
        run: dotnet format style WebDAVClient.sln --diagnostics IDE0011 --severity error --no-restore --verify-no-changes

      - name: Build
        id: build
        run: dotnet build -c Release --no-restore

      - name: Test .NET 8
        run: dotnet test WebDAVClient.UnitTests/WebDAVClient.UnitTests.csproj -c Release -f net8.0 --no-build --verbosity normal -p:CollectCoverage=true

      - name: Test compatibility harness offline
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test WebDAVClient.InteropTests/WebDAVClient.InteropTests.csproj -c Release --no-build --verbosity normal

      - name: Test .NET 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test WebDAVClient.UnitTests/WebDAVClient.UnitTests.csproj -c Release -f net10.0 --no-build --verbosity normal -p:CollectCoverage=true

      - name: Upload coverage reports
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: WebDAVClient.UnitTests/TestResults/coverage/**/*.cobertura.xml
          if-no-files-found: error

      - name: Pack
        if: ${{ success() && github.event_name != 'pull_request' }}
        run: dotnet pack WebDAVClient/WebDAVClient.csproj -c Release --no-build -o ${{ github.workspace }}/Release/nuget

      - name: Push to NuGet
        if: ${{ success() && github.event_name != 'pull_request' }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          for file in Release/nuget/WebDAVClient.*.nupkg; do
            dotnet nuget push -s https://api.nuget.org/v3/index.json -k "$NUGET_API_KEY" "$file"
            echo "Published $(basename "$file")" >> "$GITHUB_STEP_SUMMARY"
          done
