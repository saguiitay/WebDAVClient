ServerName localhost
DavLockDB /usr/local/apache2/var/DavLock
Alias /dav /usr/local/apache2/htdocs/dav
<Directory /usr/local/apache2/htdocs/dav>
    DAV On
    Options Indexes
    AuthType Basic
    AuthName "Isolated interoperability fixture"
    AuthUserFile /usr/local/apache2/conf/interop.passwd
    Require valid-user
</Directory>
